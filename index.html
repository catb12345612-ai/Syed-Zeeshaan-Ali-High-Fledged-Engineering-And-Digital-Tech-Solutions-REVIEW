<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart Scan | High-Fledged Tech</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap');
        
        body { 
            font-family: 'Inter', sans-serif; 
            color: #ffffff; 
            margin: 0; 
            overflow-x: hidden; 
            min-height: 100vh; 
        }
        
        /* Cinematic Background Slideshow */
        #bg-slider-container { 
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -2; background-color: #050505; 
        }
        
        .bg-slide { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background-size: cover; background-position: center; 
            opacity: 0; transition: opacity 2s ease-in-out; 
        }
        
        .bg-slide.active { opacity: 0.55; }
        
        .overlay { 
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; 
            background: linear-gradient(to bottom, rgba(0,0,0,0.6), rgba(0,0,0,0.98)); 
        }
        
        /* Premium Glass Morphism Components */
        .glass-btn { 
            background: rgba(15, 15, 15, 0.45); 
            backdrop-filter: blur(16px); 
            -webkit-backdrop-filter: blur(16px); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }
        
        .glass-btn:hover {
            background: rgba(30, 30, 30, 0.6);
        }
        
        .glass-btn:active { 
            transform: scale(0.96); 
        }

        /* Themed Border Hovers */
        .hover-border-blue:hover { border-color: rgba(59, 130, 246, 0.5); }
        .hover-border-green:hover { border-color: rgba(34, 197, 94, 0.5); }
        .hover-border-pink:hover { border-color: rgba(236, 72, 153, 0.5); }
        .hover-border-red:hover { border-color: rgba(239, 68, 68, 0.5); }
        .hover-border-purple:hover { border-color: rgba(168, 85, 247, 0.5); }
        
        /* 1-Tap Magic Button */
        .smart-review-btn { 
            background: linear-gradient(135deg, #d4af37, #b8860b, #996515); 
            background-size: 200% 200%;
            border: none; 
            box-shadow: 0 4px 25px rgba(212, 175, 55, 0.3); 
            animation: pulse-gold 3s infinite, gradient-shift 4s ease infinite; 
        }
        
        @keyframes gradient-shift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        @keyframes pulse-gold { 
            0% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.4); } 
            70% { box-shadow: 0 0 0 12px rgba(212, 175, 55, 0); } 
            100% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0); } 
        }
        
        .font-mono-custom { font-family: 'JetBrains Mono', monospace; }
    </style>
</head>
<body class="flex flex-col items-center p-4">

    <!-- Auto Slideshow Engine -->
    <div id="bg-slider-container">
        <div class="bg-slide active" style="background-image: url('https://images.unsplash.com/photo-1451187580459-43490279c0fa?q=80&w=2072&auto=format&fit=crop');"></div>
        <div class="bg-slide" style="background-image: url('https://images.unsplash.com/photo-1518770660439-4636190af475?q=80&w=2070&auto=format&fit=crop');"></div>
        <div class="bg-slide" style="background-image: url('https://images.unsplash.com/photo-1550751827-4bd374c3f58b?q=80&w=2070&auto=format&fit=crop');"></div>
        <div class="bg-slide" style="background-image: url('https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?q=80&w=2070&auto=format&fit=crop');"></div>
        <div class="bg-slide" style="background-image: url('https://images.unsplash.com/photo-1484417894907-623942c8ee29?q=80&w=2069&auto=format&fit=crop');"></div>
    </div>
    <div class="overlay"></div>

    <div class="w-full max-w-md mx-auto pt-6 pb-12 relative z-10">
        
        <!-- Identity Section -->
        <div class="text-center mb-10 relative">
            <h1 class="text-2xl font-extrabold mt-5 tracking-wide drop-shadow-lg text-white">Syed Zeeshaan Ali</h1>
            <h2 class="text-[11px] font-mono-custom text-yellow-500 uppercase tracking-[0.2em] mt-3 px-2 leading-relaxed drop-shadow-md font-bold">
                High-Fledged Engineering <br> & Digital Tech Solutions
            </h2>
        </div>

        <div class="space-y-4 px-2">
            
            <!-- 1-Tap Smart Review Button -->
            <button onclick="triggerInstantReview()" class="smart-review-btn w-full text-black font-extrabold py-5 rounded-2xl text-sm uppercase tracking-widest flex items-center justify-between px-6 transition-transform active:scale-95 mb-8">
                <div class="flex items-center gap-4">
                    <i class="fab fa-google text-xl bg-white p-2 rounded-full text-black drop-shadow-sm"></i>
                    <span>Generate 5-Star Review</span>
                </div>
                <i class="fas fa-bolt text-black text-lg"></i>
            </button>

            <div class="flex items-center gap-4 mb-6">
                <div class="h-px bg-gray-700 flex-1"></div>
                <span class="text-[10px] text-gray-400 uppercase tracking-widest font-mono-custom">Connect & Navigate</span>
                <div class="h-px bg-gray-700 flex-1"></div>
            </div>

            <!-- Social & Contact Grid (Numbers visually hidden, functional on tap) -->
            <div class="grid grid-cols-2 gap-4">
                
                <!-- Call -->
                <a href="tel:+917989698613" class="glass-btn hover-border-blue p-4 rounded-2xl flex flex-col items-center justify-center gap-3">
                    <i class="fas fa-phone-alt text-2xl text-blue-400 drop-shadow-[0_0_8px_rgba(59,130,246,0.5)]"></i>
                    <span class="text-xs font-semibold tracking-wide text-gray-200">Call Support</span>
                </a>
                
                <!-- WhatsApp -->
                <a href="https://wa.me/919032208086" target="_blank" class="glass-btn hover-border-green p-4 rounded-2xl flex flex-col items-center justify-center gap-3">
                    <i class="fab fa-whatsapp text-3xl text-green-400 drop-shadow-[0_0_8px_rgba(34,197,94,0.5)]"></i>
                    <span class="text-xs font-semibold tracking-wide text-gray-200">WhatsApp</span>
                </a>
                
                <!-- Instagram -->
                <a href="https://www.instagram.com/syedzeeshaanali07/" target="_blank" class="glass-btn hover-border-pink p-4 rounded-2xl flex flex-col items-center justify-center gap-3">
                    <i class="fab fa-instagram text-3xl text-pink-400 drop-shadow-[0_0_8px_rgba(236,72,153,0.5)]"></i>
                    <span class="text-xs font-semibold tracking-wide text-gray-200">Instagram</span>
                </a>
                
                <!-- Google Maps Location -->
                <a href="https://www.google.com/maps?cid=6693925689250949705" target="_blank" class="glass-btn hover-border-red p-4 rounded-2xl flex flex-col items-center justify-center gap-3">
                    <i class="fas fa-map-marker-alt text-2xl text-red-400 drop-shadow-[0_0_8px_rgba(239,68,68,0.5)]"></i>
                    <span class="text-xs font-semibold tracking-wide text-gray-200">Location</span>
                </a>

            </div>

            <!-- Full Width Website Link -->
            <a href="https://catb12345612-ai.github.io/Syed-Zeeshaan-Ali-High-Fledged-Engineering-And-Digital-Tech-Solutions-Site/" target="_blank" class="glass-btn hover-border-purple mt-4 w-full p-4 rounded-2xl flex items-center justify-center gap-3 group">
                <i class="fas fa-globe text-xl text-purple-400 drop-shadow-[0_0_8px_rgba(168,85,247,0.5)] group-hover:animate-pulse"></i>
                <span class="text-xs font-bold uppercase tracking-widest text-gray-200">Visit Official Website</span>
            </a>

        </div>
    </div>

    <!-- Ultra High-Performance Core Scripts -->
    <script>
        // 1. Cinematic Background Auto-Slider (7-second intervals)
        const slides = document.querySelectorAll('.bg-slide');
        let currentSlide = 0;
        setInterval(() => {
            slides[currentSlide].classList.remove('active');
            currentSlide = (currentSlide + 1) % slides.length;
            slides[currentSlide].classList.add('active');
        }, 7000);

        // 2. Fragment Array Matrix for 340+ Unique Review Combinations
        const reviewOpener = [
            "Absolutely incredible experience!", 
            "Highly professional and top-tier service.", 
            "Mind-blowing digital solutions.", 
            "Best tech architecture in Telangana.", 
            "Outstanding quality and elite support.", 
            "Syed Zeeshaan Ali is a master engineer.", 
            "Flawless execution of projects."
        ];
        
        const reviewBody = [
            "The level of engineering here is truly IIT-grade.", 
            "Everything works perfectly, seamlessly, and instantly.", 
            "Exceeded all my expectations from start to finish.", 
            "The smart hub systems are an absolute game changer.", 
            "Brilliant technical knowledge with zero errors.", 
            "Their digital tech solutions completely modernized my business.", 
            "Very reliable, highly skilled, and perfectly detail-oriented."
        ];
        
        const reviewCloser = [
            "Highly recommended to everyone! 🚀", 
            "Will definitely work with him again. 🔥", 
            "5 stars without a second thought! ⭐⭐⭐⭐⭐", 
            "A true asset to the tech industry.", 
            "Best developer in Khammam hands down.", 
            "Simply unmatched quality and dedication.", 
            "Thank you for the phenomenal work!"
        ];

        // 3. One-Tap Execution Engine
        function triggerInstantReview() {
            // Generate Random String Matrix
            const o = reviewOpener[Math.floor(Math.random() * reviewOpener.length)];
            const b = reviewBody[Math.floor(Math.random() * reviewBody.length)];
            const c = reviewCloser[Math.floor(Math.random() * reviewCloser.length)];
            const finalMagicReview = `${o} ${b} ${c}`;
            
            const destinationURL = "https://search.google.com/local/reviews?placeid=ChIJ7SxFpcJZNDoRSSqqzPKZ5Vw&q=H.NO+:+15,+Syed+Zeeshaan+Ali+High-Fledged+Engineering+And+Digital+Tech+Solutions,+3-Te0025,+Gani+Cafe,+Tekulapalli,+Khammam,+Telangana&authuser=0&hl=en&gl=IN";

            // Asynchronous Execution with Fallback routing
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(finalMagicReview).then(() => {
                    window.location.href = destinationURL;
                }).catch(() => {
                    window.location.href = destinationURL;
                });
            } else {
                window.location.href = destinationURL;
            }
        }
    </script>
</body>
</html>
