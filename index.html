<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart Scan | Syed Zeeshaan Ali</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            color: #ffffff; 
            margin: 0; 
            overflow-x: hidden; 
            min-height: 100vh; 
        }
        #bg-slider-container { 
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -2; background-color: #050505; 
        }
        .bg-slide { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-size: cover; background-position: center; opacity: 0; transition: opacity 2s ease-in-out; 
        }
        .bg-slide.active { opacity: 0.6; }
        .overlay { 
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; background: linear-gradient(to bottom, rgba(0,0,0,0.5), rgba(0,0,0,0.95)); 
        }
        .glass-btn { 
            background: rgba(10, 10, 10, 0.4); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.15); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        .glass-btn:active { 
            transform: scale(0.97); background: rgba(255, 255, 255, 0.1); 
        }
        .smart-review-btn { 
            background: linear-gradient(135deg, #d4af37, #b8860b); border: none; box-shadow: 0 4px 20px rgba(212, 175, 55, 0.4); animation: pulse-gold 3s infinite; 
        }
        @keyframes pulse-gold { 
            0% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.5); } 
            70% { box-shadow: 0 0 0 15px rgba(212, 175, 55, 0); } 
            100% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0); } 
        }
    </style>
</head>
<body class="flex flex-col items-center p-4">

    <div id="bg-slider-container">
        <div class="bg-slide active" style="background-image: url('https://images.unsplash.com/photo-1451187580459-43490279c0fa?q=80&w=2072&auto=format&fit=crop');"></div>
    </div>
    <div class="overlay"></div>

    <div class="w-full max-w-md mx-auto pt-6 pb-12 relative z-10">
        
        <div class="text-center mb-8 relative">
            <h1 class="text-2xl font-extrabold mt-5 tracking-wide drop-shadow-md">Syed Zeeshaan Ali</h1>
            <h2 class="text-xs font-mono text-yellow-500 uppercase tracking-widest mt-2 px-4 leading-relaxed drop-shadow-md">High-Fledged Engineering <br> & Digital Tech Solutions</h2>
        </div>

        <div class="space-y-3 px-2">
            
            <!-- NEW: The WhatsApp Number Capture Input -->
            <div class="glass-btn p-4 rounded-xl border border-yellow-500/50 text-center mb-4">
                <p class="text-xs text-yellow-400 font-bold mb-2 uppercase tracking-widest">🎁 Enter WhatsApp for 5% Off</p>
                <input type="tel" id="customer-phone-input" placeholder="e.g. 919876543210" class="w-full bg-black/60 border border-gray-600 rounded-lg p-3 text-white text-center font-mono focus:outline-none focus:border-yellow-500 mb-2">
            </div>

            <!-- Smart Review Button -->
            <button id="main-review-btn" onclick="triggerSmartScan()" class="smart-review-btn w-full text-black font-bold py-4 rounded-xl text-sm uppercase tracking-wider flex items-center justify-between px-6 transition-transform active:scale-95">
                <div class="flex items-center gap-3">
                    <i class="fab fa-google text-lg bg-white p-1.5 rounded-full text-black"></i>
                    <span id="btn-text">Post a 5-Star Review</span>
                </div>
                <i class="fas fa-chevron-right text-black/60"></i>
            </button>
            <p id="scan-status" class="text-green-400 text-xs text-center font-mono hidden bg-black/50 py-2 rounded shadow-lg">Generating...</p>

            <!-- Hidden AI Reply Box -->
            <div id="ai-reply-box" class="hidden mt-4 glass-btn rounded-xl p-5 border border-yellow-500/30 relative">
                <div class="absolute -top-3 left-4 bg-black px-2 text-[10px] text-yellow-500 font-mono tracking-widest border border-yellow-500/30 rounded">AI INSTANT REPLY</div>
                <p id="ai-reply-text" class="text-sm text-gray-200 italic leading-relaxed mt-2"></p>
                <a id="final-google-btn" href="https://g.page/r/CUkqqszymeVcEBI/review" target="_blank" class="mt-5 block w-full text-center bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-lg text-sm transition shadow-lg">
                    <i class="fab fa-google mr-2"></i> Open Google to Paste Review
                </a>
            </div>

            <!-- WhatsApp Direct (Using your number) -->
            <a href="https://wa.me/919032208086" target="_blank" class="glass-btn w-full py-3.5 rounded-xl flex items-center justify-between px-6 text-white hover:border-green-500 group">
                <div class="flex items-center gap-4">
                    <i class="fab fa-whatsapp text-2xl text-green-500"></i>
                    <div class="text-left"><div class="font-bold text-sm tracking-wide">WhatsApp Direct</div></div>
                </div>
            </a>
        </div>
    </div>

    <script>
        const masterReviewDatabase = [
            "Syed Zeeshaan Ali provides an incredible experience. Highly professional and absolutely top-tier service!",
            "Absolutely mind-blowing tech! 🔥 Zeeshaan's systems are flawless.",
            "Highly recommended! Best developer in Telangana hands down.",
            "The level of engineering here is IIT-grade. Just wow! 🚀"
        ];

        async function triggerSmartScan() {
            const customerPhone = document.getElementById('customer-phone-input').value;
            
            // Check if they entered a number before letting them review!
            if (!customerPhone) {
                alert("⚠️ Please enter your WhatsApp number to claim your offer and post a review!");
                return;
            }

            const randomReviewText = masterReviewDatabase[Math.floor(Math.random() * masterReviewDatabase.length)];
            const btnText = document.getElementById('btn-text');
            const status = document.getElementById('scan-status');
            const aiReplyBox = document.getElementById('ai-reply-box');
            const aiReplyText = document.getElementById('ai-reply-text');
            const mainBtn = document.getElementById('main-review-btn');
            const googleReviewLink = "https://g.page/r/CUkqqszymeVcEBI/review";
            
            btnText.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Fetching AI Reply...';
            status.classList.remove('hidden');
            mainBtn.style.pointerEvents = 'none';

            try { await navigator.clipboard.writeText(randomReviewText); } catch(err) {}

            try {
                // YOUR EXACT WEB APP URL IS PASTED HERE
                const scriptURL = "https://script.google.com/macros/s/AKfycbzGIdgij9SerCsUe8vATzlaDauzXN2QE24lUHZ2VpONgNwuS8hQEDENrhRzJB3PzNj_/exec"; 
                
                const payload = {
                    phone: customerPhone, // Sends the typed number to your Google Sheet!
                    reviewText: randomReviewText,
                    stars: 5
                };

                const response = await fetch(scriptURL, { method: 'POST', body: JSON.stringify(payload) });
                const data = await response.json();

                if(data.success && data.isPositive) {
                    aiReplyText.innerText = `"${data.aiReply}"`;
                    aiReplyBox.classList.remove('hidden');
                    btnText.innerHTML = '<i class="fas fa-check-circle mr-2"></i> Review Copied!';
                    status.innerText = "Reply generated successfully. Click below to post.";
                } else {
                    window.location.href = googleReviewLink;
                }

            } catch (err) {
                console.log(err);
                window.location.href = googleReviewLink;
            }
        }
    </script>
</body>
</html>
